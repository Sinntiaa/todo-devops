# Resolver bawaan Docker: nama service di-resolve ulang tiap 5 detik,
# jadi setelah container dibuat ulang (deploy CD) Nginx tidak memakai IP lama.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;

    # API -> semua replika backend (Docker DNS mengembalikan IP semua replika = load balancing)
    location /api/ {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Halaman web -> container frontend
    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
    }
}